name: CI

on:
  # CI runs on merges to main. The App Factory already runs build + tests on every
  # PR (its QA) before cutting it, so we don't pay GitHub for a second copy of
  # ticket-PR CI.
  #
  # VERSION BRANCHES ARE THE EXCEPTION, and not for convenience. FINAL §12.2's
  # first eligibility clause is "final full CI green AT THE EXACT SHA" of the
  # Version HEAD — a property of a commit, not of a branch, because the Version's
  # HEAD moves and a green run against a superseded SHA describes code that is no
  # longer what would merge (§11.4, SPIKE-13: two runs, opposite conclusions, one
  # commit). Without a run on the version branch that clause cannot be satisfied
  # by anything, so the Version flow is not merely unverified — it is unrunnable.
  #
  # This is also the shape DL-053 recorded: a lane passed every gate it could run
  # and still broke the repository's own gate, because the lane could not see what
  # CI checks. The factory's QA is not a substitute for the repository's CI at the
  # commit that would merge.
  push:
    branches: [main, 'version/**']
  # LINT ONLY, at the commit that would merge — see the `lint` job below. Added
  # after the note above proved true twice in one day: a `prettier --check` break
  # landed on main, was fixed, and a second one landed one merge later. Both were
  # invisible on their PRs, because nothing ran there.
  #
  # This does NOT walk back the cost argument above. The test matrix and the image
  # build still run on push only; what runs here is the ~1-minute hook suite that
  # is FIRST in the job and therefore gates everything after it. A formatting break
  # does not fail a step — it stops pytest, the frontend tests, the wheel build,
  # the smoke test and the e2e suite from running at all, and on a push-only
  # trigger nobody learns that until it is already on main. Eight merges went in
  # that way before anyone noticed.
  pull_request:
    branches: [main]
  # So a Version's final CI can be re-run against an exact SHA on demand, rather
  # than by pushing an empty commit to move HEAD — which would invalidate the run
  # it was trying to produce.
  workflow_dispatch:

# One in-flight run per ref; a new push cancels the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: this workflow only reads the repo (checkout, tests,
# build). Artifact upload uses the Actions runtime token, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  # PR-ONLY, and deliberately just the hooks. `pre-commit` is the first step of
  # `test`, so anything it rejects stops that whole job — the tests, the wheel, the
  # smoke test and the e2e suite never run. On a push-only trigger that is only
  # discoverable AFTER the merge, which is how a one-line prettier wrap gated the
  # entire suite for eight consecutive merges.
  #
  # One Python version, no matrix, no store isolation: nothing here touches the
  # filesystem or the console's DB, so the `test` job's `FACTORY_CONSOLE_DB_PATH`
  # dance and its leak-guard have nothing to guard against and are not repeated.
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # Same ordering constraint as in `test`: pnpm before setup-node, whose
      # `cache: pnpm` shells out to pnpm.
      - uses: pnpm/action-setup@v3
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Both installs are needed even though nothing is run: the ruff hooks come
      # from the dev extras, and the prettier/eslint hooks shell into frontend's
      # node_modules.
      - name: Install Python package (dev extras)
        run: pip install -e '.[dev]'

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Lint (pre-commit, all files)
        run: pre-commit run --all-files

  test:
    # Push and workflow_dispatch only — the full matrix stays off PRs, which is the
    # cost argument at the top of this file. `lint` above is the PR-side gate.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # Linux-only: macOS runners bill at 10x and blow the free-tier minute
        # budget; the dev machine is macOS, so Mac-specific issues surface there.
        os: [ubuntu-latest]
        # Quoted so YAML keeps them as strings ('3.11', not the float 3.1).
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Isolate the console's own store
        # Exported once via GITHUB_ENV rather than per-step, because EVERY step
        # below can reach the store: pytest, the packaged-wheel smoke boot, and
        # the CLI Playwright spawns. The harness already points itself at its own
        # temp file (e2e global-setup, the integration conftest); this is the
        # backstop for everything that does not, and the leak-guard step at the
        # end of the job is what proves the pair of them worked.
        #
        # GITHUB_ENV, not a job-level `env:` block, because the value has to be
        # RUNNER_TEMP-derived and the `runner` context is not available at job
        # level — and a literal "$RUNNER_TEMP/..." in an `env:` value is never
        # shell-expanded. It gets its own subdirectory rather than sitting at the
        # root of RUNNER_TEMP, because creating the store chmods its parent
        # directory to 0700, and that parent should be one the store owns and not
        # the scratch dir every other step on the runner shares.
        run: echo "FACTORY_CONSOLE_DB_PATH=$RUNNER_TEMP/factory-console-ci/console.db" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          # No requirements.txt in this repo; hash pyproject.toml instead so the
          # pip cache has a dependency file to key on (else setup-python errors).
          cache-dependency-path: pyproject.toml

      # pnpm must be on PATH BEFORE setup-node, whose `cache: pnpm` shells out to
      # pnpm. There is no packageManager field in frontend/package.json, so the
      # version must be pinned here (frontend uses pnpm 11).
      - uses: pnpm/action-setup@v3
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          # Node 22+: pnpm 11 (installed above) crashes on Node 20 with
          # ERR_UNKNOWN_BUILTIN_MODULE — the same reason the Dockerfile's
          # frontend-builder is on node:22-alpine (see commit 6870e07).
          node-version: 22
          cache: pnpm
          # Lockfile lives under frontend/, not the repo root.
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Python package (dev extras)
        run: pip install -e '.[dev]'

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Lint (pre-commit, all files)
        run: pre-commit run --all-files

      - name: Python tests + coverage
        run: pytest -q --cov=factory_console --cov-report=xml

      - name: Frontend tests
        run: pnpm --dir frontend test

      - name: Build wheel + sdist (bundles the SPA into _static/)
        run: bash scripts/package.sh

      - name: Smoke-test the packaged wheel
        # Reuses scripts/smoke.sh, which installs the newest dist/*.whl (built by
        # the previous step) into a throwaway venv, boots the console on --port 0,
        # and curls /api/v1/health.
        run: bash scripts/smoke.sh

      - name: Playwright e2e
        run: pnpm --dir frontend exec playwright install --with-deps chromium && pnpm --dir frontend e2e

      - name: Upload coverage report
        # Unique name per matrix cell — upload-artifact@v4 errors on duplicate
        # names. always() so it still runs if a prior step failed after coverage
        # was written.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: error

      - name: Assert the runner's home store is untouched
        # The CI half of the harness's leak guard: the suites isolate themselves,
        # this proves it rather than trusting it, so a future change that drops
        # the isolation fails a check instead of quietly writing a registry into
        # whatever home it runs in — a developer's, not just a throwaway runner's.
        # always() because a suite that failed halfway can still have leaked, and
        # that is exactly the run where you want to be told.
        if: always()
        run: |
          set -euo pipefail
          if [ -e "$HOME/.factory-console" ]; then
            ls -la "$HOME/.factory-console" || true
            echo "::error::$HOME/.factory-console exists after the suite: something ignored FACTORY_CONSOLE_DB_PATH and wrote the console store into the runner's real home."
            exit 1
          fi
          echo "clean: no $HOME/.factory-console after the suite."

  docker:
    # Build and smoke-test the multi-stage image so the Dockerfile can't ship
    # untested behind a green check. ubuntu-only: the hosted macOS runner has no
    # Docker daemon. Independent of the `test` matrix job, so it can't affect it.
    #
    # Push and workflow_dispatch only, like `test`: an image build pulls base
    # images over the network on every run (which is its one observed flake — a
    # Docker Hub i/o timeout), and paying that on every PR push buys nothing the
    # post-merge run does not already cover.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t factory-console:ci .

      - name: Smoke-test the runtime image
        # Exercises the packaged entrypoint end-to-end: `--version` boots the
        # installed console far enough to print the wheel version and exit 0,
        # proving the wheel installed and the entrypoint resolves in the runtime
        # stage.
        run: docker run --rm factory-console:ci --version
