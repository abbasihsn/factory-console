name: Release

# Tag-driven publish: pushing a semver tag builds the wheel + sdist, publishes to
# PyPI via trusted publishing, signs the artifacts with a keyless sigstore build-
# provenance attestation (verified in-run), and cuts a GitHub Release with the
# attestation bundle attached. The tag is the source of truth — it must equal
# factory_console.__version__ (guarded below) or the run fails fast before anything
# is published. The signing/verify steps are purely additive: they run after the
# irreversible PyPI upload and never touch the dist/ contents it publishes.
on:
  push:
    tags: ['v*.*.*']

# One run per tag ref, and never cancel an in-flight publish: a half-finished
# PyPI upload / GitHub Release must not be interrupted by a racing tag push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege: no default token scopes at the top level. Each job opts into
# exactly what it needs (build only reads; publish gets id-token + contents).
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
    # EVERY action in this job is SHA-pinned, first-party ones included. This job
    # produces the wheel and sdist that `publish` uploads to PyPI unmodified and
    # then attests — so a movable tag here is a movable tag on the published
    # artifact. A retagged or compromised action could inject code into the SPA
    # bundle baked into `_static/`, and the sigstore provenance would still be
    # VALID (it attests what `publish` received, not how `build` produced it), so
    # the tampering would pass the exact `gh attestation verify` flow the README
    # tells consumers to trust. The trailing comment tracks the human-readable
    # ref; bump both together.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history + tags so downstream release-note generation has the
          # complete tag graph to diff against.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Quoted so YAML keeps it a string ('3.12', not the float 3.12).
          python-version: '3.12'

      # pnpm must be on PATH BEFORE setup-node, whose `cache: pnpm` shells out to
      # pnpm. There is no packageManager field in frontend/package.json, so the
      # version must be pinned here (frontend uses pnpm 11).
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 22+: pnpm 11 (installed above) crashes on Node 20 with
          # ERR_UNKNOWN_BUILTIN_MODULE — the same reason ci.yml and the
          # Dockerfile's frontend-builder pin Node 22. Do not "fix" this back to 20.
          node-version: 22
          cache: pnpm
          # Lockfile lives under frontend/, not the repo root.
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Assert tag matches package version
        # The pushed tag (minus the leading `v`) must equal __version__, else the
        # wheel would publish under a version nobody tagged. factory_console.__init__
        # imports with no third-party deps, so no pip install is needed for this.
        run: |
          PYTHONPATH=server python -c 'import factory_console, sys; assert factory_console.__version__ == sys.argv[1], f"tag v{sys.argv[1]} does not match factory_console.__version__ {factory_console.__version__}"' "${GITHUB_REF_NAME#v}"

      - name: Install the build backend
        # scripts/package.sh runs `python -m build`; that backend is all this job
        # needs beyond the guard (no `.[dev]`).
        run: pip install build

      - name: Install frontend dependencies
        # Parity with ci.yml; warms the pnpm store so package.sh's re-install is a
        # fast no-op.
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Build wheel + sdist (bundles the SPA into _static/)
        run: bash scripts/package.sh

      - name: Smoke-test the packaged wheel
        # Boot the freshly built wheel (install into a throwaway venv, --port 0,
        # curl /api/v1/health) BEFORE it can reach the publish job. PyPI versions
        # are irreversible, so a wheel whose entrypoint crashes on launch must never
        # be published. Reuses scripts/smoke.sh, exactly as ci.yml does.
        run: bash scripts/smoke.sh

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted-publishing identity + Release creation both run against this
    # environment. A maintainer can point `pypi` at TestPyPI to rehearse a release.
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing (OIDC) + keyless sigstore signing
      contents: write # create the GitHub Release
      attestations: write # actions/attest-build-provenance records the provenance attestation
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI (trusted publishing, OIDC)
        # Default packages-dir is dist/. No repository-url => production PyPI.
        # SHA-pinned (supply-chain hardening for a credential-bearing publish job);
        # the trailing comment tracks the human-readable ref. Bump both together.
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1

      - name: Attest build provenance (keyless, sigstore/OIDC)
        id: attest
        # Additive supply-chain hardening that runs AFTER the irreversible PyPI
        # upload and never mutates dist/ — the wheel + sdist PyPI received are
        # byte-for-byte what get attested here. Keyless: the job's OIDC id-token is
        # exchanged for a short-lived Fulcio signing certificate and the provenance
        # is recorded in the Rekor transparency log — no long-lived signing key or
        # secret. SHA-pinned like every other action in this file — see the build
        # job's note on why the tag policy was dropped. Consumers verify with:
        #   gh attestation verify <wheel|sdist> --repo abbasihsn/factory-console
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'dist/*'

      - name: Verify the provenance attestation
        # Fail fast if signing produced nothing verifiable: check each wheel/sdist
        # against the attestation just recorded, so a missing/invalid attestation
        # fails the run instead of shipping unverifiable artifacts. Uses the runner's
        # preinstalled gh CLI — no extra action (hence no SHA to resolve).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in dist/*; do
            gh attestation verify "$f" --repo "${{ github.repository }}"
          done

      - name: Create GitHub Release
        # SHA-pinned; trailing comment tracks the human-readable ref (bump together).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # Attach the dist artifacts plus the sigstore attestation bundle (kept out
          # of dist/ so the PyPI upload above stays pristine) for consumer verification.
          files: |
            dist/*
            ${{ steps.attest.outputs.bundle-path }}
          generate_release_notes: true
