[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-console"
dynamic = ["version"]
description = "Local web console for browsing App Factory project plans, tickets, and run-state."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "pydantic>=2",
    "pydantic-settings>=2",
    "markdown-it-py>=3",
    "mdit-py-plugins>=0.4",
    "bleach>=6",
    "PyYAML>=6",
    "watchdog>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "build>=1",
    "pre-commit>=3",
]

[project.scripts]
factory-console = "factory_console.cli:app"

[tool.setuptools.dynamic]
version = { attr = "factory_console.__version__" }

[tool.setuptools.packages.find]
where = ["server"]
include = ["factory_console*"]

[tool.setuptools.package-data]
"factory_console" = ["_static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["factory_console"]

[tool.ruff.lint.flake8-bugbear]
# Typer's Argument()/Option() are the framework's required default-factories for
# CLI parameters, and FastAPI's Depends() is the framework's dependency-injection
# idiom, so calling them in argument defaults is intended (not B008).
extend-immutable-calls = ["typer.Argument", "typer.Option", "fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``server`` for the package under test; ``tests`` so shared test-only helpers
# (e.g. ``_read_only_guard``) import as top-level modules from any test file.
pythonpath = ["server", "tests"]
asyncio_mode = "auto"

[tool.coverage.report]
# Enforce the 85% overall coverage gate documented in ARCHITECTURE.md. CI runs
# `pytest --cov=factory_console`, which honors this fail_under, so coverage can
# no longer silently regress behind a green check.
fail_under = 85
