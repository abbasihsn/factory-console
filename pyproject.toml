[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-console"
description = "Local read-only web console for browsing an App Factory project's tickets, dependencies, and run-state."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Factory Console contributors" }]
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "bleach>=6.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "build>=1.2",
    "pre-commit>=3.7",
]

[project.scripts]
factory-console = "factory_console.cli:app"

[tool.setuptools.dynamic]
version = { attr = "factory_console.__version__" }

[tool.setuptools.packages.find]
where = ["server"]
include = ["factory_console*"]

[tool.setuptools.package-data]
factory_console = ["_static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
